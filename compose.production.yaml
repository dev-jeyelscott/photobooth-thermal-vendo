name: thermasnap-production

x-app-service: &app-service
  image: ${THERMASNAP_APP_IMAGE:?Set THERMASNAP_APP_IMAGE to a release-tagged image}
  build:
    context: .
    target: app
    args:
      APP_UID: ${APP_UID:-10001}
      APP_GID: ${APP_GID:-10001}
  env_file:
    - ${APP_ENV_FILE:-/etc/photobooth/app.env}
  working_dir: /var/www/html
  volumes:
    - type: bind
      source: ${THERMASNAP_MEDIA_PATH:-/srv/photobooth/media}
      target: /var/www/html/storage/app/public
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    postgres:
      condition: service_healthy

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: "${DOCKER_LOG_MAX_FILES:-5}"

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    env_file:
      - ${POSTGRES_ENV_FILE:-/etc/photobooth/postgres.env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54320}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-production.sh:/docker-entrypoint-initdb.d/10-thermasnap.sh:ro
    cpus: "${POSTGRES_CPUS:-1.0}"
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    <<: *app-service
    restart: unless-stopped
    command: ["php-fpm", "-F"]
    cpus: "${APP_CPUS:-0.75}"
    mem_limit: ${APP_MEMORY_LIMIT:-768m}
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@fsockopen('127.0.0.1', 9000) === false ? 1 : 0);",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  worker:
    <<: *app-service
    restart: unless-stopped
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "database",
        "--queue=default",
        "--sleep=3",
        "--tries=3",
        "--timeout=${QUEUE_WORKER_TIMEOUT:-60}",
        "--max-time=3600",
      ]
    cpus: "${WORKER_CPUS:-1.0}"
    mem_limit: ${WORKER_MEMORY_LIMIT:-1g}
    logging: *default-logging
    stop_grace_period: 1h
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(str_contains(str_replace(chr(0), ' ', file_get_contents('/proc/1/cmdline')), 'artisan queue:work') ? 0 : 1);",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  scheduler:
    <<: *app-service
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    cpus: "${SCHEDULER_CPUS:-0.25}"
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-256m}
    logging: *default-logging
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(str_contains(str_replace(chr(0), ' ', file_get_contents('/proc/1/cmdline')), 'artisan schedule:work') ? 0 : 1);",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: ${THERMASNAP_NGINX_IMAGE:?Set THERMASNAP_NGINX_IMAGE to a release-tagged image}
    build:
      context: .
      target: nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_HOST_PORT:-8081}:80"
    volumes:
      - type: bind
        source: ${THERMASNAP_MEDIA_PATH:-/srv/photobooth/media}
        target: /var/www/html/storage/app/public
        read_only: true
    cpus: "${NGINX_CPUS:-0.25}"
    mem_limit: ${NGINX_MEMORY_LIMIT:-128m}
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/up >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
