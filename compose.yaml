name: thermasnap

x-app-service: &app-service
  image: thermasnap-app:dev
  build:
    context: .
    target: development
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  env_file:
    - .env.docker
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
    - node_modules:/var/www/html/node_modules
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54320}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    <<: *app-service
    restart: unless-stopped
    command: ["php-fpm", "-F"]
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@fsockopen('127.0.0.1', 9000) === false ? 1 : 0);",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  worker:
    <<: *app-service
    restart: unless-stopped
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "database",
        "--queue=default",
        "--sleep=3",
        "--tries=3",
        "--timeout=60",
        "--max-time=3600",
      ]
    stop_grace_period: 1h

  scheduler:
    <<: *app-service
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 30s

  vite:
    <<: *app-service
    restart: unless-stopped
    command: ["npm", "run", "dev"]
    ports:
      - "${VITE_PORT:-5173}:5173"

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/up >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
  vendor:
  node_modules:
