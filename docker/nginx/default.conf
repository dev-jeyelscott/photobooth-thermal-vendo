map $http_x_forwarded_for $thermasnap_forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $thermasnap_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $thermasnap_forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

map $http_host $thermasnap_request_port {
    default                                 $server_port;
    ~^[^:]+:(?<thermasnap_host_port>\d+)$ $thermasnap_host_port;
}

map $http_x_forwarded_port $thermasnap_forwarded_port {
    default $http_x_forwarded_port;
    ""      $thermasnap_request_port;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 40m;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ^~ /storage/captures/ {
        return 404;
    }

    location ^~ /storage/receipts/ {
        return 404;
    }

    location /storage/ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_param HTTP_X_FORWARDED_FOR $thermasnap_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $thermasnap_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $thermasnap_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $thermasnap_forwarded_port;

        fastcgi_pass app:9000;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
